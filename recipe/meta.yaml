{% set name = "jupyterlab-urdf" %}
{% set version = "0.7.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/jupyter-robotics/{{ name }}/releases/download/v{{ version }}/{{ name }}-{{ version }}.tar.gz
  sha256: b334408f15fa80ebab4ca95f5ac71072fe5d88f03f00254482c0ccc3620a5e6f

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - python {{ python_min }}
    - hatchling
    - nodejs
    - hatch-nodejs-version
    - hatch-jupyter-builder
    - jupyter-builder
  run:
    - python >={{ python_min }}

test:
  imports:
    - jupyterlab_urdf
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/jupyter-robotics/jupyterlab-urdf
  summary: A URDF viewer and editor extension for JupyterLab.
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - IsabelParedes
