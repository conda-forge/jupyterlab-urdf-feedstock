{% set name = "jupyterlab-urdf" %}
{% set version = "0.7.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/jupyter-robotics/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: b18ace96af792e6b06737fcabdb7c7bbca0e73bd26322bb0a9f9a3f18e6e9c8f

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - python {{ python_min }}
    - hatchling
    - nodejs
    - hatch-nodejs-version
    - hatch-jupyter-builder
    - jupyter-builder
  run:
    - python >={{ python_min }}

test:
  imports:
    - jupyterlab_urdf
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/jupyter-robotics/jupyterlab-urdf
  summary: A URDF viewer and editor extension for JupyterLab.
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - IsabelParedes
